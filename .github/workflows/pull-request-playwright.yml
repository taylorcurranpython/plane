name: Playwright E2E tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "preview"
    types:
      - "opened"
      - "synchronize"
      - "ready_for_review"
      - "reopened"
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/**"
      - "e2e/**"
      - "docker-compose-e2e.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/pull-request-playwright.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    env:
      CI: true
      COMPOSE_PROJECT_NAME: plane
      NODE_OPTIONS: "--max-old-space-size=4096"
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      E2E_API_BASE_URL: http://localhost:8000
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Generate env files
        run: |
          cp .env.example .env
          for app in web api space admin live; do cp "apps/$app/.env.example" "apps/$app/.env"; done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start backend stack
        run: docker compose -f docker-compose-e2e.yml up -d --build --wait

      - name: Build web app
        run: pnpm turbo run build --filter=web...

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}

      - name: Install Playwright browsers
        run: pnpm test:e2e:install

      - name: Run Playwright suite
        env:
          PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm --filter=web start
        run: pnpm test:e2e

      - name: API logs
        if: failure()
        run: docker compose -f docker-compose-e2e.yml logs e2e-api

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose-e2e.yml down -v
